[package]
name = "acta"
version = "4.3.0-beta7"
description = "Acta"
authors = ["MogroWang Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "acta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 局域网同步的逐接口定向广播需要枚举本机 IPv4 地址（std 无此能力）。
if-addrs = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 测速探针的「块间空闲」计时（tokio::time::timeout）需要 time 能力；
# tokio 本体已随 tauri/reqwest 引入，这里只是显式声明使用到的 feature。
tokio = { version = "1", default-features = false, features = ["time"] }
# 更新包自 v4.3.0 起为 zip 压缩包（Release 资产统一 Acta-<版本>-<平台>-<架构>.zip），
# 向导安装时解出其中的 Acta.exe / Acta.dmg；只用 deflate，不带多余格式支持。
zip = { version = "2", default-features = false, features = ["deflate"] }
# 托盘图标：后台运行时承载恢复窗口与退出入口。
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
url = "2"

# 图标适配：macOS 26+ Dock 位图解码/裁切/缩放（与 tauri 内置 image 同源）；
# Windows 任务栏图标按系统 DPI 尺寸重采样同样依赖。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target."cfg(windows)".dependencies]
# 任务栏（ICON_BIG）图标设置：Tauri 的 set_icon 只写标题栏小图标。
# 钉选到任务栏后的图标同步还需 IShellLinkW（改写钉选快捷方式的图标位置）。
# 版本必须与 tauri crate 使用的 windows crate 一致，否则 hwnd 类型对不上。
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSObject"] }
